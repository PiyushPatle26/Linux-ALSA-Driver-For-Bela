%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ti,am625-bela-gem-multi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bela Gem Multi Audio Cape for PocketBeagle2 (AM625)

maintainers:
  - Piyush Patle <piyushpatle1228@gmail.com>

description: |
  The Bela Gem Multi is a multi-channel audio cape for PocketBeagle2
  (AM625). It combines two codecs on a shared TDM bus driven by McASP2:

    TLV320AIC3106 - stereo codec, 2ch in + 2ch out, BCLK/WCLK master
    ES9080Q       - 8-channel DAC, outputs only, BCLK/WCLK slave

  Total I/O: 10 outputs (2 AIC3106 + 8 ES9080Q) + 2 inputs (AIC3106).

  Clock topology:
    McASP2 outputs MCLK (~24 MHz) to TLV320AIC3106 via AUDIO_EXT_REFCLK1.
    TLV320AIC3106 PLL generates BCLK (256 clocks/frame) and WCLK (48 kHz)
    which are fed back to McASP2 and ES9080Q. Both operate as clock slaves.

  TDM slot allocation (16 slots x 32 bits):
    Slots 0-1  : TLV320AIC3106 (stereo in/out)
    Slots 2-9  : ES9080Q (8-channel output)
    Slots 10-15: Unused

properties:
  compatible:
    const: ti,am625-bela-gem-multi

  model:
    description: User-visible sound card name.

  cpu-dai:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the McASP2 node. Operates as BCLK and WCLK consumer.

  aic3106-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the TLV320AIC3106 codec node. Acts as BCLK and WCLK
      master for the shared TDM bus.

  es9080q-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the ES9080Q DAC node. Operates as TDM slave.

  audio-routing:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description:
      DAPM route pairs connecting board connectors to codec widget names.

  clocks:
    maxItems: 1
    description:
      MCLK reference clock. On AM625 this is audio_refclk1 output from
      the McASP2 assigned-clocks configuration (~24 MHz).

  clock-names:
    items:
      - const: mclk

required:
  - compatible
  - cpu-dai
  - aic3106-codec
  - es9080q-codec
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        aic3106: codec@18 {
            compatible = "ti,tlv320aic3106";
            reg = <0x18>;
            #sound-dai-cells = <0>;
        };

        es9080q: dac@48 {
            compatible = "ess,es9080q";
            reg = <0x48>;
            #sound-dai-cells = <0>;
            ess,write-only-addr = <0x4c>;
        };
    };

    sound {
        compatible = "ti,am625-bela-gem-multi";
        model = "PocketBeagle2 Bela Gem Multi";

        cpu-dai = <&mcasp2>;
        aic3106-codec = <&aic3106>;
        es9080q-codec = <&es9080q>;

        clocks = <&audio_refclk1>;
        clock-names = "mclk";

        audio-routing =
            "Headphone Jack", "HPLOUT",
            "Headphone Jack", "HPROUT",
            "LINE1L",         "Line In",
            "LINE1R",         "Line In",
            "DAC Out 1",      "OUT1",
            "DAC Out 2",      "OUT2",
            "DAC Out 3",      "OUT3",
            "DAC Out 4",      "OUT4",
            "DAC Out 5",      "OUT5",
            "DAC Out 6",      "OUT6",
            "DAC Out 7",      "OUT7",
            "DAC Out 8",      "OUT8";
    };
